name: Build Sliver Server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build assets
        run: make .downloaded_assets

      - name: Build server (linux/amd64)
        env:
          CGO_ENABLED: "0"
        run: |
          go build -mod=vendor -trimpath -tags go_sqlite,server \
            -ldflags "-s -w" \
            -o sliver-server ./server

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: sliver-server-linux-amd64
          path: sliver-server
          retention-days: 7
